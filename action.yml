name: Publish npm packages
description: Build and publish pnpm workspace packages to npm with a dist-tag derived from the git tag or an explicit input.

inputs:
  tag-prefix:
    description: "Git tag prefix to strip to get the version (e.g. console-v)"
    required: false
    default: "v"
  dist-tag:
    description: "Explicit npm dist-tag. If empty, derived from the git tag (prerelease id such as beta/next/rc, otherwise latest)"
    required: false
    default: ""
  default-dist-tag:
    description: "Fallback dist-tag when not on a tag push and dist-tag is empty"
    required: false
    default: latest
  packages-dir:
    description: "Directory containing the packages to publish"
    required: false
    default: packages
  build-filter:
    description: "pnpm --filter expression used for the build step"
    required: false
    default: "./packages/**"
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  npm-token:
    description: "npm auth token (omit if using trusted publishing)"
    required: false
    default: ""
  access:
    description: "npm access level (public/restricted). Empty = package default"
    required: false
    default: ""
  dry-run-only:
    description: "Only run the dry-run preview, do not publish"
    required: false
    default: "false"
  fail-on-build-error:
    description: "Fail if the build step fails"
    required: false
    default: "false"

outputs:
  dist-tag:
    description: "The npm dist-tag that was used"
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: https://registry.npmjs.org

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Determine npm dist-tag
      id: release
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        INPUT_TAG: ${{ inputs.dist-tag }}
        DEFAULT_TAG: ${{ inputs.default-dist-tag }}
      run: |
        set -euo pipefail

        if [[ -n "$INPUT_TAG" ]]; then
          TAG="$INPUT_TAG"
        elif [[ "$REF_TYPE" == "tag" ]]; then
          VERSION="${REF_NAME#"$TAG_PREFIX"}"
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"      # 1.2.0-beta.1 -> beta.1
            TAG="${PRE%%.*}"         # beta.1 -> beta
            [[ "$TAG" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]] || TAG="beta"
          else
            TAG="latest"
          fi
        else
          TAG="$DEFAULT_TAG"
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Publishing with npm dist-tag: $TAG"

    - name: Build packages
      shell: bash
      env:
        FILTER: ${{ inputs.build-filter }}
        FAIL: ${{ inputs.fail-on-build-error }}
      run: |
        if pnpm --filter "$FILTER" -r --if-present run build; then
          exit 0
        fi
        if [[ "$FAIL" == "true" ]]; then
          echo "::error::Build failed"
          exit 1
        fi
        echo "::warning::Build failed, continuing"

    - name: Preview packages
      shell: bash
      working-directory: ${{ inputs.packages-dir }}
      run: pnpm publish -r --dry-run --no-git-checks

    - name: Publish packages to npm
      if: ${{ inputs.dry-run-only != 'true' }}
      shell: bash
      working-directory: ${{ inputs.packages-dir }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NPM_DIST_TAG: ${{ steps.release.outputs.tag }}
        NPM_ACCESS: ${{ inputs.access }}
      run: |
        ARGS=(-r --tag "$NPM_DIST_TAG" --no-git-checks)
        if [[ -n "$NPM_ACCESS" ]]; then ARGS+=(--access "$NPM_ACCESS"); fi
        pnpm publish "${ARGS[@]}"