name: "Publish ZikoJS Packages"
description: "Builds, previews, and publishes pnpm monorepo packages to npm"

inputs:
  npm-token:
    description: "NPM authentication token"
    required: true
  tag-prefix:
    description: "Git tag prefix to parse version (e.g., notebook-v)"
    required: true
  filter-path:
    description: "pnpm workspace filter path"
    required: false
    default: "./packages/**"
  working-directory:
    description: "Working directory where publish runs"
    required: false
    default: "packages"
  default-dist-tag:
    description: "Default npm dist-tag for workflow_dispatch"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        registry-url: https://registry.npmjs.org

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Determine npm dist-tag
      id: release
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_TAG: ${{ inputs.default-dist-tag }}
        PREFIX: ${{ inputs.tag-prefix }}
      run: |
        set -euo pipefail

        if [[ "$EVENT_NAME" == "push" ]]; then
          VERSION="${REF_NAME#$PREFIX}"

          if [[ "$VERSION" == *-* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi
        else
          TAG="${INPUT_TAG:-latest}"
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Publishing with npm dist-tag: $TAG"

    - name: Build packages when possible
      shell: bash
      continue-on-error: true
      run: pnpm --filter "${{ inputs.filter-path }}" -r --if-present run build

    - name: Preview packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm publish -r --tag "${{ steps.release.outputs.tag }}" --dry--run

    - name: Publish packages to npm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NPM_DIST_TAG: ${{ steps.release.outputs.tag }}
      run: pnpm publish -r --tag "$NPM_DIST_TAG"
