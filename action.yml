
name: "ZikoJS Publish"
description: "Build and publish a pnpm monorepo to npm"

inputs:
  tag-prefix:
    description: "Git release tag prefix, e.g. notebook-v"
    required: true

  packages-directory:
    description: "Directory containing publishable packages"
    required: false
    default: packages

  build-filter:
    description: "pnpm filter used to build packages"
    required: false
    default: "./packages/**"

  dist-tag:
    description: "npm dist-tag for manual releases"
    required: false
    default: latest

  npm-token:
    description: "npm authentication token"
    required: true

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        registry-url: https://registry.npmjs.org

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Determine npm dist-tag
      id: release
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        INPUT_TAG: ${{ inputs.dist-tag }}
      run: |
        set -euo pipefail

        if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
          if [[ "$REF_NAME" != "$TAG_PREFIX"* ]]; then
            echo "Unexpected release tag: $REF_NAME"
            exit 1
          fi

          VERSION="${REF_NAME#"$TAG_PREFIX"}"

          if [[ "$VERSION" == *-* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi
        else
          TAG="$INPUT_TAG"
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Publishing with npm dist-tag: $TAG"

    - name: Build packages
      shell: bash
      continue-on-error: true
      env:
        BUILD_FILTER: ${{ inputs.build-filter }}
      run: pnpm --filter "$BUILD_FILTER" -r --if-present run build

    - name: Preview packages
      shell: bash
      working-directory: ${{ inputs.packages-directory }}
      run: pnpm publish -r --dry-run

    - name: Publish packages
      shell: bash
      working-directory: ${{ inputs.packages-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        NPM_DIST_TAG: ${{ steps.release.outputs.tag }}
      run: pnpm publish -r --tag "$NPM_DIST_TAG"
